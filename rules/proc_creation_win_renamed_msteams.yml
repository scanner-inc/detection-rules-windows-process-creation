# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Renamed Microsoft Teams Execution
description: |-
  Detects the execution of a renamed Microsoft Teams binary.

  References:
  * Internal Research

  False Positives:
  * Unknown
severity: Medium
query_text: |-
  @scnr.source_type="windows:process_creation"
  OriginalFileName: (
    'msteams.exe'
    'teams.exe'
  )
  (not
    Image: (
      '\\msteams.exe'
      '\\teams.exe'
    )
  )
  | stats
    min(@scnr.datetime) as firstTime,
    max(@scnr.datetime) as lastTime,
    count() as eventCount
    by
    Image,
    OriginalFileName,
    CommandLine,
    User,
    LogonId,
    Computer
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- medium_severity_alerts

